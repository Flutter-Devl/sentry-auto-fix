name: codeguardian_fixer
description: Automated code-fix generation built on top of the rule engine.
version: 0.1.0
publish_to: none

environment:
  sdk: '^3.4.0'

dependencies:
  analyzer: ^6.4.0
  codeguardian_core:
    path: ../codeguardian_core
  codeguardian_native:
    path: ../codeguardian_native
  codeguardian_rules:
    path: ../codeguardian_rules
  meta: ^1.15.0
  path: ^1.9.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
